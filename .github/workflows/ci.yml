name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python script
        run: python3 -c "import ast; ast.parse(open(\"scripts/analyze.py\").read()); print(\"OK\")"
      - name: Check skill structure
        run: |
          test -f skills/apk-analyzer/SKILL.md && echo "SKILL.md found"
          test -d skills/apk-analyzer/references && echo "references dir found"
